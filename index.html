<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="./app.js" defer type="module"></script>
    <title>Document</title>
</head>

<body>

    <header>
        <div class="containerLogo">
            <img src="./img/logoLion.png" alt="">
            <span>Lion School</span>
        </div>
        <div class="containerLogout">
            <img id="backPage" src="./img/back.png" alt="">
            <span>Sair</span>
        </div>
    </header>

    <main>
        <section class="containerImgMain">
            <div>
                <h1>Escolha um <span>curso</span> para gerenciar</h1>
                <img src="./img/mainImgPC.png" alt="">
            </div>
            <img class="imgStudant" src="./img/studant.png" alt="">
        </section>
        <section class="choiceCourses"></section>
        <section id="students" class="sectionStudents">
            <figcaption>
                <div class="containerStatus">
                    <span id="status">Status</span>
                    <ul id="listStatus">
                        <li>
                            <span>Status</span>
                            <img src="./img/confirmStatus.png" alt="">    
                        </li>
                        <li>
                            <span>Finalizado</span>
                            <img src="" alt="">
                        </li>
                        <li>
                            <span>Cursando</span>
                            <img src="" alt="">
                        </li>
                    </ul>
                </div>
                <div class="containerlegend">
                    <span>LEGENDA</span>
                    <div>
                        <div class="colorLegend purple"></div>
                        <span>Cursando</span>
                    </div>
                    <div>
                        <div class="colorLegend"></div>
                        <span>Finalizado</span>
                    </div>
                </div>
            </figcaption>
            <h2>Desenvolvimento de sistemas</h2>
            <div class="containerStudents"></div>
        </section>
        <section id="studentProfile" class="sectionProfile">
            <div class="dataStudent">
                <img src="" alt="">
                <span></span>
            </div>
            <div class="notes"></div>
        </section>
    </main>

    <footer>
        <ul class="ulContacts">
            <li>
                <img src="./img/phoneIcon.png" alt="">
                <span>(11) 4774-4700</span>
            </li>
            <li>
                <img src="./img/iconEmail.png" alt="">
                <span>lionschool@gmail.com</span>
            </li>
            <li>
                <img src="./img/locationIcon.png" alt="">
                <span>Rua tcc, 211, Centro, Jandira</span>
            </li>
        </ul>
        <span class="copyright">Copyright © 2026 | João Victor Santos de Moraes</span>
        <ul class="ulSocials">
            <li><img src="./img/youtubeIcon.png" alt=""></li>
            <li><img src="./img/twitterIcon.png" alt=""></li>
            <li><img src="./img/instaIcon.png" alt=""></li>
            <li><img src="./img/facebookIcon.png" alt=""></li>
        </ul>
    </footer>

</body>

</html>
